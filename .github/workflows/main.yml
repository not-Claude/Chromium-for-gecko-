name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Генерируем Gradle Wrapper 9.3.1
      - name: Generate & Ensure Gradle Wrapper 9.3.1
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew

      # Создаём дефолтный debug.keystore прямо перед сборкой
      - name: Create Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Сохраняем обновлённый wrapper в репозиторий
      - name: Commit updated Gradle Wrapper
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: update Gradle wrapper to 9.3.1"
          file_pattern: "gradlew gradlew.bat gradle/wrapper/*"

      # Сборка Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Выгрузка APK в артефакты GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          
